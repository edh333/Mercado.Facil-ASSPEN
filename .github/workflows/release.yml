name: Release

# Roda o release completo (web + functions + regras + instaladores) quando:
#   - uma tag v* é enviada (git push --tags após npm version)
#   - ou acionado manualmente (Actions → Release → Run workflow)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release completo (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    # contents: write — o GITHUB_TOKEN precisa criar o GitHub Release e
    # subir os instaladores como assets (espelho do Storage, sem cota de banda).
    permissions:
      contents: write
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          # Glob explícito cobre root (web) e functions/ (Cloud Functions):
          # qualquer mudança em UM dos locks invalida o cache (seguro — nunca
          # restaura estado misto). As duas pastas compartilham o cache npm.
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Portão de qualidade: se lint ou testes falharem, o release NÃO é publicado.
      - name: Lint (typecheck)
        run: npm run lint

      - name: Testes da web (vitest)
        run: npm test

      # npm ci na raiz só instala as deps do app; as deps das functions (em
      # functions/) não existem no runner — instalar antes dos testes/deploy.
      - name: Instalar dependências (Cloud Functions)
        run: npm ci
        working-directory: functions

      - name: Testes das Cloud Functions (vitest)
        shell: pwsh
        run: npm test
        working-directory: functions

# O Vite injeta as variáveis no build — o .env é montado a partir dos secrets
      - name: Montar .env (config publica do Firebase)
        shell: pwsh
        run: |
          # Config PÚBLICA do Firebase web (vai no bundle JS do navegador/app).
          # Mantida aqui (não em secret) para o CI não depender de 6 secrets.
          $envLines = @(
            "VITE_FIREBASE_API_KEY=AIzaSyCa3QnGwbTyldoPqYeVO-L24iftVm7lsT8",
            "VITE_FIREBASE_AUTH_DOMAIN=mercado-facil-mt.firebaseapp.com",
            "VITE_FIREBASE_PROJECT_ID=mercado-facil-mt",
            "VITE_FIREBASE_STORAGE_BUCKET=mercado-facil-mt.firebasestorage.app",
            "VITE_FIREBASE_MESSAGING_SENDER_ID=714788107870",
            "VITE_FIREBASE_APP_ID=1:714788107870:web:ee371b5398d060544ca6cf"
          )
          [System.IO.File]::WriteAllLines((Join-Path ($env:GITHUB_WORKSPACE) '.env'), $envLines)
          Write-Output "Arquivo .env criado ($($envLines.Count) variáveis)"

      # O hosting serve a pasta build/ (base '/' obrigatória no FireHosting);
      # ela é gitignorada e não existe no runner — precisa ser gerada aqui.
      - name: Build web (hosting)
        shell: pwsh
        run: npm run build

      # No runner não há sessão OAuth; o Firebase CLI autentica via ADC
      # (GOOGLE_APPLICATION_CREDENTIALS) com a service account do projeto.
      - name: Preparar credencial da service account
        shell: pwsh
        env:
          # Secret via env (não dentro de "${{ }}") — o JSON tem aspas internas
          # e injetado literal no script quebrava o pwsh (ParserError).
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          $sa = $env:FIREBASE_SA_JSON
          Write-Output "Diagnóstico: valor do secret tem $($sa.Length) caractere(s)."
          if ([string]::IsNullOrWhiteSpace($sa)) {
            throw "Secret FIREBASE_SERVICE_ACCOUNT ausente/vazio. Cole o JSON da service account do projeto (Console Firebase -  SDK Admin - service account) em Settings `- Secrets and variables `- Actions."
          }
          $arquivo = "$env:RUNNER_TEMP\firebase-sa.json"
          [System.IO.File]::WriteAllText($arquivo, $sa)
          Write-Output "GOOGLE_APPLICATION_CREDENTIALS=$arquivo" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          Write-Output "Service account gravada em $arquivo (CLI 15.x, deploy via ADC)"

      # O deploy de FUNCTIONS exige leitura de billing do projeto; a service
      # account não tem acesso à conta de faturamento (IAM do billing é
      # gerenciado fora do projeto). Por isso o deploy usa o refresh token
      # OAuth do dono (o mesmo do firebase login:ci), renovado aqui — a service
      # account continua valida para a publicação dos instaladores (just 1/2).
      - name: Renovar token OAuth do dono (deploy)
        shell: pwsh
        env:
          # Secret via env (idem SA): nunca interpolar secret dentro do script
          # (${{ }} inline fica visível no log e gera ParserError no pwsh).
          FIREBASE_CLI_REFRESH_TOKEN: ${{ secrets.FIREBASE_CLI_REFRESH_TOKEN }}
        run: |
          $rt = $env:FIREBASE_CLI_REFRESH_TOKEN
          if ([string]::IsNullOrWhiteSpace($rt)) {
            throw "Secret FIREBASE_CLI_REFRESH_TOKEN ausente. Rode 'firebase login:ci' e grave o token em Settings `- Secrets and variables `- Actions."
          }
          $body = "client_id=563584335869-fgrhgmd47bqnekij5i8b5pr03ho849e6.apps.googleusercontent.com&client_secret=j9iVZfS8kkCEFUPaAeJV0sAi&grant_type=refresh_token&refresh_token=$([uri]::EscapeDataString($rt))"
          $tok = Invoke-RestMethod -Uri 'https://oauth2.googleapis.com/token' -Method Post -Body $body -ContentType 'application/x-www-form-urlencoded'
          if (-not $tok.access_token) { throw "Falha ao renovar token OAuth do dono" }
          Write-Output "FIREBASE_DEPLOY_TOKEN=$($tok.access_token)" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          Write-Output "Token OAuth renovado (deploy via identidade do dono)."

      - name: Deploy Firebase (hosting, firestore, storage, functions)
        shell: pwsh
        run: npx --yes firebase-tools@15.8.0 deploy --only hosting,firestore,storage,functions --project mercado-facil-mt --token "$env:FIREBASE_DEPLOY_TOKEN" --non-interactive

      - name: Gerar instaladores (Usuário + Admin)
        shell: pwsh
        run: node scripts/build-exe.mjs

      - name: Publicar instaladores + version.json no Storage
        shell: pwsh
        run: node scripts/publish-apps.cjs

      # Espelho SEM custo de banda: GitHub Releases recebe os MESMOS .exe (72 MB
      # cada) — tira os downloads pesados da cota de egresso do Cloud Storage
      # (100 GB/mês grátis). Fonte primária continua sendo o Storage/Firebase.
      # IMPORTANTE: o GITHUB_TOKEN NÃO é injetado no ambiente automaticamente —
      # precisa ser passado explicitamente (senão o script "pula" por falta de token).
      - name: Publicar instaladores no GitHub Releases (espelho)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-gh-release.cjs

      # Smoke test pós-deploy: confirma que o front (index), a Cloud Function
      # de download do app e o version.json respondem com a versão recém-publicada.
      - name: Smoke test após o deploy
        shell: pwsh
        run: |
          $versao = node -e "console.log(require('./package.json').version)"
          $ok = $true
          try {
            $pagina = Invoke-WebRequest -Uri 'https://mercado-facil-mt.web.app/' -UseBasicParsing -TimeoutSec 30
            if ($pagina.StatusCode -ne 200) { $ok = $false; Write-Output "FALHA: index retornou $($pagina.StatusCode)" }
          } catch { $ok = $false; Write-Output "FALHA: index: $($_.Exception.Message)" }

          try {
            $fn = Invoke-RestMethod -Uri 'https://us-central1-mercado-facil-mt.cloudfunctions.net/obterDownloadAppUsuario?plataforma=Windows' -TimeoutSec 30
            $okV = [string]$fn.versao -eq $versao
            if ($fn.ok -ne $true -or -not $okV) { $ok = $false; Write-Output "FALHA: endpoint versao=$($fn.versao) ok=$($fn.ok) (esperado $versao/true)" }
          } catch { $ok = $false; Write-Output "FALHA: endpoint: $($_.Exception.Message)" }

          try {
            $vj = Invoke-RestMethod -Uri 'https://firebasestorage.googleapis.com/v0/b/mercado-facil-mt.firebasestorage.app/o/apps%2Fversion.json?alt=media' -TimeoutSec 30
            if ($vj.version -ne $versao) { $ok = $false; Write-Output "FALHA: version.json version=$($vj.version) (esperado $versao)" }
          } catch { $ok = $false; Write-Output "FALHA: version.json: $($_.Exception.Message)" }

          if (-not $ok) { throw "Smoke test falhou — publicação comprometida." }
          Write-Output "Smoke test OK: index, endpoint e version.json em v$versao."

      - name: Publicar artefatos (instaladores)
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-v
          path: dist-electron/*.exe
          retention-days: 14