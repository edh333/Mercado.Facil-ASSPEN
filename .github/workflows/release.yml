name: Release

# Roda o release completo (web + functions + regras + instaladores) quando:
#   - uma tag v* é enviada (git push --tags após npm version)
#   - ou acionado manualmente (Actions → Release → Run workflow)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release completo (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Portão de qualidade: se lint ou testes falharem, o release NÃO é publicado.
      - name: Lint (typecheck)
        run: npm run lint

      - name: Testes da web (vitest)
        run: npm test

      # npm ci na raiz só instala as deps do app; as deps das functions (em
      # functions/) não existem no runner — instalar antes dos testes/deploy.
      - name: Instalar dependências (Cloud Functions)
        run: npm ci
        working-directory: functions

      - name: Testes das Cloud Functions (vitest)
        shell: pwsh
        run: npm test
        working-directory: functions

# O Vite injeta as variáveis no build — o .env é montado a partir dos secrets
      - name: Montar .env a partir dos secrets
        shell: pwsh
        run: |
          # Config PÚBLICA do Firebase web (vai no bundle JS do navegador/app).
          # Mantida aqui (não em secret) para o CI não depender de 6 secrets.
          $envLines = @(
            "VITE_FIREBASE_API_KEY=AIzaSyCa3QnGwbTyldoPqYeVO-L24iftVm7lsT8",
            "VITE_FIREBASE_AUTH_DOMAIN=mercado-facil-mt.firebaseapp.com",
            "VITE_FIREBASE_PROJECT_ID=mercado-facil-mt",
            "VITE_FIREBASE_STORAGE_BUCKET=mercado-facil-mt.firebasestorage.app",
            "VITE_FIREBASE_MESSAGING_SENDER_ID=714788107870",
            "VITE_FIREBASE_APP_ID=1:714788107870:web:ee371b5398d060544ca6cf"
          )
          [System.IO.File]::WriteAllLines((Join-Path ($env:GITHUB_WORKSPACE) '.env'), $envLines)
          Write-Output "Arquivo .env criado ($($envLines.Count) variáveis)"

      # O hosting serve a pasta build/ (base '/' obrigatória no FireHosting);
      # ela é gitignorada e não existe no runner — precisa ser gerada aqui.
      - name: Build web (hosting)
        shell: pwsh
        run: npm run build

      # No runner não há sessão OAuth; o Firebase CLI autentica via ADC
      # (GOOGLE_APPLICATION_CREDENTIALS) com a service account do projeto.
      - name: Preparar credencial da service account
        shell: pwsh
        run: |
          $sa = "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          if ([string]::IsNullOrWhiteSpace($sa)) {
            throw "Secret FIREBASE_SERVICE_ACCOUNT ausente. Cole o JSON da service account do projeto (Console Firebase -  SDK Admin - service account) em Settings `- Secrets and variables `- Actions."
          }
          $arquivo = "$env:RUNNER_TEMP\firebase-sa.json"
          [System.IO.File]::WriteAllText($arquivo, $sa)
          Write-Output "GOOGLE_APPLICATION_CREDENTIALS=$arquivo" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          Write-Output "Service account gravada em $arquivo (CLI 15.x, deploy via ADC)"

      - name: Deploy Firebase (hosting, firestore, storage, functions)
        shell: pwsh
        run: npx --yes firebase-tools@15.8.0 deploy --only hosting,firestore,storage,functions --project mercado-facil-mt --non-interactive

      - name: Gerar instaladores (Usuário + Admin)
        shell: pwsh
        run: node scripts/build-exe.mjs

      - name: Publicar instaladores + version.json no Storage
        shell: pwsh
        run: node scripts/publish-apps.cjs

      - name: Publicar artefatos (instaladores)
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-v
          path: dist-electron/*.exe
          retention-days: 14